<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Dr. Pascal Giessler — AI Principal &amp; Cloud Architect">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0b08"/>

  <!-- Subtle grain via radial gradient highlight (top-left) -->
  <defs>
    <radialGradient id="warm" cx="0" cy="0" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a120a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0e0b08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- Eyebrow gold rule -->
  <line x1="100" y1="140" x2="220" y2="140" stroke="#d49140" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyebrow label -->
  <text x="100" y="190" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" font-weight="500" fill="#d49140" letter-spacing="0.32em">DR. PASCAL GIESSLER</text>

  <!-- Main title — two-line composition for vertical rhythm -->
  <text x="100" y="350" font-family="Cormorant, Georgia, 'Times New Roman', serif" font-size="96" font-weight="400" fill="#ede4d3">AI Principal &amp;</text>
  <text x="100" y="450" font-family="Cormorant, Georgia, 'Times New Roman', serif" font-size="96" font-weight="400" font-style="italic" fill="#d4b572">Cloud Architect</text>

  <!-- Credential tagline -->
  <text x="100" y="520" font-family="Outfit, 'Helvetica Neue', system-ui, sans-serif" font-size="28" font-weight="400" fill="#a39d8d">PhD · KIT Karlsruhe · MIT · Azure Solutions Architect Expert</text>

  <!-- Domain stamp bottom-left -->
  <text x="100" y="585" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="500" fill="#7d7567" letter-spacing="0.18em">PASCAL-GIESSLER.DE</text>

  <!-- P|G monogram top-right (consistent with favicon + header logo) -->
  <line x1="1050" y1="100" x2="1050" y2="190" stroke="#d49140" stroke-width="3" stroke-linecap="round"/>
  <text x="1024" y="172" font-family="Cormorant, Georgia, 'Times New Roman', serif" font-size="64" font-weight="500" fill="#ede4d3" text-anchor="middle">P</text>
  <text x="1078" y="172" font-family="Cormorant, Georgia, 'Times New Roman', serif" font-size="64" font-weight="500" fill="#ede4d3" text-anchor="middle">G</text>
</svg>
