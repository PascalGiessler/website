<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Dr. Pascal Giessler: Principal AI &amp; AI Lead">
  <!--
    Composition note: Google's SERP thumbnail center-crops this 1200x630 card to a
    square (~x 285–915). All essential content is therefore centered and kept inside
    that safe zone, so the title + monogram survive the crop while the full card still
    reads well for LinkedIn / X / Facebook unfurls. Regenerate with `pnpm og-card`.
  -->

  <!-- Background -->
  <rect width="1200" height="630" fill="#0e0b08"/>

  <!-- Soft centered warm glow -->
  <defs>
    <radialGradient id="warm" cx="600" cy="300" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0e0b08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- brand-mark:start -->
  <svg x="540" y="85" width="120" height="92.21052631578948" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 146" role="img" aria-label="Verbundene Initialen p und g">
  <defs>
    <clipPath id="pg-copper"><path d="M-10-10 H103 V57 L87 49 V160 H-10Z"/></clipPath>
    <clipPath id="pg-ivory"><path d="M103-10 H200 V160 H87 V53 L103 61Z"/></clipPath>
  </defs>
  <g fill="none" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M15 55 A40 40 0 0 1 95 55 A40 40 0 0 0 175 55" stroke="#D19360" clip-path="url(#pg-copper)"/>
    <path d="M15 55 A40 40 0 0 1 95 55 A40 40 0 0 0 175 55" stroke="#EEE9E0" clip-path="url(#pg-ivory)"/>
    <path d="M15 55 A40 40 0 0 0 77.943057 87.766082" stroke="#D19360"/>
    <path d="M112.056943 22.233918 A40 40 0 0 1 175 55 V90 A40 40 0 0 1 112.056943 122.766082" stroke="#EEE9E0"/>
  </g>
  <path fill="#D19360" d="M7 7 H23 V138 H7 Z"/>
</svg>
  <!-- brand-mark:end -->

  <!-- Eyebrow label -->
  <text x="600" y="238" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" font-weight="500" fill="#d49140" letter-spacing="0.3em" text-anchor="middle">DR. PASCAL GIESSLER</text>

  <!-- Main title — two centered lines for vertical rhythm -->
  <text x="600" y="360" font-family="Cormorant, Georgia, 'Times New Roman', serif" font-size="80" font-weight="400" fill="#ede4d3" text-anchor="middle">Principal AI &amp;</text>
  <text x="600" y="448" font-family="Cormorant, Georgia, 'Times New Roman', serif" font-size="80" font-weight="400" font-style="italic" fill="#d4b572" text-anchor="middle">AI Lead</text>

  <!-- Gold rule under the title -->
  <line x1="552" y1="496" x2="648" y2="496" stroke="#d49140" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Credential tagline -->
  <text x="600" y="542" font-family="Outfit, 'Helvetica Neue', system-ui, sans-serif" font-size="24" font-weight="400" fill="#a39d8d" text-anchor="middle">Ex-CTO · Stealth CEO · Mentor · Strategic Advisor</text>

  <!-- Domain stamp -->
  <text x="600" y="590" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#7d7567" letter-spacing="0.22em" text-anchor="middle">PASCAL-GIESSLER.DE</text>
</svg>
