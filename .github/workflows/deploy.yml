name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Search Console verification tokens. Set as repo Variables
          # (Settings → Secrets and variables → Actions → Variables);
          # falls back to Secrets if you put them there instead.
          # The site only renders the meta tag when the value is non-empty.
          PUBLIC_GSC_VERIFY: ${{ vars.PUBLIC_GSC_VERIFY || secrets.PUBLIC_GSC_VERIFY }}
          PUBLIC_BING_VERIFY: ${{ vars.PUBLIC_BING_VERIFY || secrets.PUBLIC_BING_VERIFY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4