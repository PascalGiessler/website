<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="3" fill="#0e0b08"/>
  <!-- Diamond outline -->
  <polygon
    points="16,4 28,16 16,28 4,16"
    fill="none"
    stroke="#d49140"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
  <!-- Center node -->
  <circle cx="16" cy="16" r="3" fill="#d49140"/>
  <!-- Connector ticks at each corner -->
  <line x1="16" y1="4"  x2="16" y2="8"  stroke="#d49140" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="24" y2="16" stroke="#d49140" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="24" stroke="#d49140" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="4"  y1="16" x2="8"  y2="16" stroke="#d49140" stroke-width="1.2" stroke-linecap="round"/>
</svg>
